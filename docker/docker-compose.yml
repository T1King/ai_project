services:
  dev:
    image: dev_rs2:rs2_v2
    container_name: dev_rs2
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - DISPLAY=:0
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${PROJECT_ROOT}/rs2_ws:/docker_rs2_ws
    working_dir: /docker_rs2_ws

    network_mode: host
    stdin_open: true
    tty: true
    command: bash
